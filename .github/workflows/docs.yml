name: Deploy Docs

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "build.gradle.kts"
      - "deadchest-plugin/build.gradle.kts"
      - "deadchest-plugin/src/main/resources/plugin.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  deploy:
    uses: Stellionix/docs-common/.github/workflows/deploy-docs.yml@main
